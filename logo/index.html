<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sulwhasoo · Logo Nav</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- 페이지 상단에서 살짝 잘려 보이는 원형 배지형 로고/내비게이션
       PRODUCTS / FLAGSHIP / ABOUT는 Figma의 실제 outline path(=
       nav_badge_ring.svg의 "Ellipse 33" path.d)를 그대로 가져와
       SVG textPath로 곡선을 따라가게 구현 (rotate() 근사치 아님). -->
  <section class="badge-stage" aria-label="주요 내비게이션">
    <div class="badge">
      <img class="badge__glow" src="assets/nav_badge.svg" alt="">

      <svg class="badge__ring" viewBox="0 0 598.585 284.376" aria-hidden="false">
        <defs>
          <!-- 원본 path의 왼쪽 절반(정점→하단, textPath가 위→아래로 읽도록 시작점 반전) : PRODUCTS -->
          <path id="arcLeft" d="M305.14 0.527532C232.088 -0.159753 161.058 12.0411 105.458 34.8116C49.8351 57.5917 13.6162 89.3246 3.43392 123.929C-6.7298 158.471 9.70413 193.698 49.9434 222.968C90.1844 252.238 151.357 273.439 221.938 282.53" />
          <!-- 왼쪽 절반을 x축 기준 그대로 대칭 이동한 좌표(오른쪽 절반) : FLAGSHIP -->
          <path id="arcRight" d="M376.647 282.53C447.228 273.439 508.4006 252.238 548.6416 222.968C588.8809 193.698 605.3148 158.471 595.1511 123.929C584.9688 89.3246 548.7499 57.5917 493.127 34.8116C437.527 12.0411 366.497 -0.159753 293.445 0.527532" />
          <!-- 원본 path가 시작/끝나는 하단 중앙의 빈 구간(=ABOUT 자리)을 잇는 완만한 보조 곡선 -->
          <path id="arcAbout" d="M195 267 Q299.29 283 403 267" />
        </defs>

        <!-- 실제 보이는 링(Figma "Ellipse 33"과 동일 path/색) -->
        <path d="M221.938 282.53C151.357 273.439 90.1844 252.238 49.9434 222.968C9.70413 193.698 -6.7298 158.471 3.43392 123.929C13.6162 89.3246 49.8351 57.5917 105.458 34.8116C161.058 12.0411 232.088 -0.159753 305.14 0.527532C378.193 1.21482 448.175 14.7425 501.876 38.5393C555.601 62.3465 589.197 94.7277 596.555 129.481C603.902 164.185 584.615 199.091 542.011 227.591C499.414 256.088 436.558 276.122 365.293 283.879" fill="none" stroke="white" stroke-opacity="0.7" />

        <a class="badge__link badge__link--products" href="#">
          <text font-size="25" letter-spacing="-1.3">
            <textPath href="#arcLeft" startOffset="58%" text-anchor="middle">PRODUCTS</textPath>
          </text>
        </a>
        <a class="badge__link badge__link--flagship" href="#">
          <text font-size="25" letter-spacing="-1.3">
            <textPath href="#arcRight" startOffset="42%" text-anchor="middle">FLAGSHIP</textPath>
          </text>
        </a>
        <a class="badge__link badge__link--about" href="#">
          <text font-size="34" letter-spacing="-1.8">
            <textPath href="#arcAbout" startOffset="50%" text-anchor="middle">ABOUT</textPath>
          </text>
        </a>
      </svg>
    </div>

    <span class="badge__logo">sulwhasoo</span>
  </section>

  <script src="js/script.js"></script>
</body>
</html>
