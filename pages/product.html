
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sulwhasoo · Product</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Open+Sans:ital,wght@0,300;0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="../components/header/header.css">
  <link rel="stylesheet" href="../components/footer/footer.css">
  <link rel="stylesheet" href="../css/product.css">
  <script src="../components/header/header.js" defer></script>
  <script src="../components/footer/footer.js" defer></script>
  <script src="../js/product.js" defer></script>
</head>
<body>

<header class="arc_nav" id="arc_nav">
  <svg id="arc_svg" viewBox="0 0 1920 260" preserveAspectRatio="xMidYMid meet" role="banner" aria-label="설화수">
    <defs>
      <filter id="soft_edge" x="-30%" y="-60%" width="160%" height="240%">
        <feGaussianBlur stdDeviation="11"/>
      </filter>
      <!-- 흰 호 끝을 투명하게 페이드아웃 — 끝선이 뚝 끊겨 보이지 않도록 -->
      <linearGradient id="fade_l" gradientUnits="userSpaceOnUse">
        <stop offset="0%"  stop-color="#FFFFFF" stop-opacity="1"/>
        <stop offset="85%" stop-color="#FFFFFF" stop-opacity="1"/>
        <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
      </linearGradient>
      <linearGradient id="fade_r" gradientUnits="userSpaceOnUse">
        <stop offset="0%"  stop-color="#FFFFFF" stop-opacity="1"/>
        <stop offset="85%" stop-color="#FFFFFF" stop-opacity="1"/>
        <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
      </linearGradient>
    </defs>

    <!-- 오렌지 타원: 블러는 여기에만 걸린다 -->
    <ellipse id="orb" cx="960" cy="-125" rx="367.5" ry="312"
             fill="var(--orange)" filter="url(#soft_edge)"/>

    <!-- 호버 감지용 투명 타원 (블러 없음) -->
    <ellipse id="hit" class="hit" cx="960" cy="-125" rx="367.5" ry="312"/>

    <!-- 얇은 흰 호: 활성 항목 자리에서 끊긴다(그 자리가 늘 움직인다), 바깥쪽 끝은 그라디언트로 사라진다 -->
    <path id="arc_l" class="arc_line" stroke="url(#fade_l)"/>
    <path id="arc_r" class="arc_line" stroke="url(#fade_r)"/>

    <!-- 곡선을 따라 흐르는 작은 라벨용 보이지 않는 경로 -->
    <path id="path_l" fill="none" stroke="none"/>
    <path id="path_r" fill="none" stroke="none"/>

    <!-- 큰(활성) 상태 PRODUCTS/FLAGSHIP용 경로 — 호와 같은 반지름, 더 넓은 폭 -->
    <path id="path_l_big" fill="none" stroke="none"/>
    <path id="path_r_big" fill="none" stroke="none"/>

    <!-- BRANDSTORY/CULTURE: PRODUCTS/FLAGSHIP과 같은 구조, 더 바깥쪽 자리 -->
    <path id="path_ll" fill="none" stroke="none"/>
    <path id="path_rr" fill="none" stroke="none"/>
    <path id="path_ll_big" fill="none" stroke="none"/>
    <path id="path_rr_big" fill="none" stroke="none"/>

    <!-- ABOUT: 다이얼 회전 중에는 다른 항목과 같은 방식으로 곡선 위에 놓인다 -->
    <path id="path_c" fill="none" stroke="none"/>
    <path id="path_c_big" fill="none" stroke="none"/>

    <!-- 워드마크: 고정 -->
    <a href="../index.html" aria-label="Sulwhasoo Home" id="link_wordmark">
      <text class="wordmark" id="wordmark" x="960" y="65"
            font-size="42" text-anchor="middle">Sulwhasoo</text>
    </a>

    <!-- BRANDSTORY: PRODUCTS/FLAGSHIP과 동일한 구조, 더 바깥쪽 자리 -->
    <a href="brandstory.html" aria-label="BRANDSTORY" id="link_ll">
      <text class="label lbl_small label_side" id="label_ll" font-size="14">
        <textPath href="#path_ll" startOffset="50%" text-anchor="middle"
                  dominant-baseline="middle">BRANDSTORY</textPath>
      </text>
      <text class="label lbl_big" id="label_ll_big" font-size="23">
        <textPath href="#path_ll_big" startOffset="50%" text-anchor="middle"
                  dominant-baseline="middle">BRANDSTORY</textPath>
      </text>
    </a>

    <!-- PRODUCTS: 작은 상태(곡선 텍스트, 선 아래) + 큰 상태(직선, 벌어진 호 중간) -->
    <a href="product.html" aria-label="PRODUCTS" id="link_l">
      <text class="label lbl_small label_side" id="label_l" font-size="14">
        <textPath href="#path_l" startOffset="50%" text-anchor="middle"
                  dominant-baseline="middle">PRODUCTS</textPath>
      </text>
      <text class="label lbl_big" id="label_l_big" font-size="23">
        <textPath href="#path_l_big" startOffset="50%" text-anchor="middle"
                  dominant-baseline="middle">PRODUCTS</textPath>
      </text>
    </a>

    <!-- FLAGSHIP: 동일 구조 -->
    <a href="flagship.html" aria-label="FLAGSHIP" id="link_r">
      <text class="label lbl_small label_side" id="label_r" font-size="14">
        <textPath href="#path_r" startOffset="50%" text-anchor="middle"
                  dominant-baseline="middle">FLAGSHIP</textPath>
      </text>
      <text class="label lbl_big" id="label_r_big" font-size="23">
        <textPath href="#path_r_big" startOffset="50%" text-anchor="middle"
                  dominant-baseline="middle">FLAGSHIP</textPath>
      </text>
    </a>

    <!-- CULTURE: PRODUCTS/FLAGSHIP과 동일한 구조, 더 바깥쪽 자리 -->
    <a href="culture.html" aria-label="CULTURE" id="link_rr">
      <text class="label lbl_small label_side" id="label_rr" font-size="14">
        <textPath href="#path_rr" startOffset="50%" text-anchor="middle"
                  dominant-baseline="middle">CULTURE</textPath>
      </text>
      <text class="label lbl_big" id="label_rr_big" font-size="23">
        <textPath href="#path_rr_big" startOffset="50%" text-anchor="middle"
                  dominant-baseline="middle">CULTURE</textPath>
      </text>
    </a>

    <!-- ABOUT: 다른 4개 항목과 동일한 구조 — 다이얼이 돌면 이 자리에 어떤 항목이든 들어올 수 있다 -->
    <a href="about.html" aria-label="ABOUT" id="link_c">
      <text class="label lbl_small label_side" id="label_c_small" font-size="14">
        <textPath href="#path_c" startOffset="50%" text-anchor="middle"
                  dominant-baseline="middle">ABOUT</textPath>
      </text>
      <text class="label lbl_big" id="label_c" font-size="23">
        <textPath href="#path_c_big" startOffset="50%" text-anchor="middle"
                  dominant-baseline="middle">ABOUT</textPath>
      </text>
    </a>
  </svg>
</header>

  <div class="page">

    <!-- ===================== INTRO / CATEGORY NAV ===================== -->
    <section class="product_intro">
      <div class="product_intro_inner">
        <h1 class="product_title">Product</h1>
        <div class="product_tabs_wrap">
          <nav class="product_tabs" aria-label="Product categories">
            <button type="button" class="product_tab is_active" data-tab="best">Best seller</button>
            <button type="button" class="product_tab_sub" data-tab="line">By product Line</button>
            <button type="button" class="product_tab_sub" data-tab="type" disabled aria-disabled="true">By Product Type</button>
            <button type="button" class="product_tab_sub" data-tab="concern" disabled aria-disabled="true">By Skin Concern</button>
          </nav>

          <div class="product_subtabs" data-subtabs-for="line" hidden>
            <button type="button" class="product_subtab is_active" data-subtab="first-care-activating">first care activating</button>
            <button type="button" class="product_subtab" data-subtab="first-care-activating-perfecting">first care activating perfecting</button>
            <button type="button" class="product_subtab" data-subtab="ginseng">ginseng</button>
            <button type="button" class="product_subtab" data-subtab="ultimate-s">the Ultimate S</button>
            <button type="button" class="product_subtab" data-subtab="essential-comfort">essential comfort</button>
            <button type="button" class="product_subtab" data-subtab="timetreasure-honorstige">timetreasure honorstige</button>
            <button type="button" class="product_subtab" data-subtab="others">others</button>
          </div>
        </div>
      </div>
    </section>

    <!-- ===================== BEST SELLER GRID ===================== -->
    <section class="product_grid_section" aria-label="Best seller products">
      <div class="product_grid">

        <article class="product_card product_card_01">
          <div class="product_card_img product_card_img_01">
            <img src="../assets/product/images/p01-ginseng-ampoule.png" alt="Concentrated Ginseng Rejuvenating Ampoule">
          </div>
          <p class="product_card_name">Concentrated Ginseng<br>Rejuvenating Ampoule</p>
        </article>

        <article class="product_card product_card_02">
          <div class="product_card_img product_card_img_02">
            <img src="../assets/product/images/p02-cleansing-oil.png" alt="Gentle Cleansing Oil">
          </div>
          <p class="product_card_name">Gentle Cleansing Oil</p>
        </article>

        <article class="product_card product_card_03">
          <button type="button" class="product_card_trigger" aria-pressed="false" aria-label="Select First Care Activating Serum VI">
            <span class="product_card_stage">
              <img class="product_card_ring product_card_ring_outer" src="../assets/product/images/product-select-ring-outer.svg" alt="">
              <img class="product_card_ring product_card_ring_inner" src="../assets/product/images/product-select-ring-inner.svg" alt="">
              <span class="product_card_img product_card_img_03">
                <img src="../assets/product/images/p03-first-care-serum.png" alt="First Care Activating Serum VI">
              </span>
            </span>
          </button>
          <p class="product_card_name">First Care Activating Serum VI</p>
          <div class="product_card_detail">
            <p class="product_card_detail_title">First Care Activating Serum VI</p>
            <p class="product_card_detail_size">50ml</p>
            <a href="product_detail.html" class="product_card_more">View More</a>
          </div>
        </article>

        <article class="product_card product_card_05">
          <div class="product_card_img product_card_img_05">
            <img src="../assets/product/images/p05-lumiwise-ampoule.png" alt="Lumiwise Brightening Ampoule Serum">
          </div>
          <p class="product_card_name">Lumiwise Brightening Ampoule Serum</p>
        </article>

        <article class="product_card product_card_04">
          <div class="product_card_img product_card_img_04">
            <img src="../assets/product/images/p04-ultimate-s-serum.png" alt="The Ultimate S Serum">
          </div>
          <p class="product_card_name">The Ultimate S Serum</p>
        </article>

      </div>
    </section>

  </div>

  <footer id="footer" data-component="footer"></footer>

</body>
</html>
