<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sulwhasoo · Footer</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500&family=Open+Sans:wght@300;400&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="footer.css">
</head>

<body>

<footer class="footer">

    <!-- Background -->
    <div class="footer_bg" aria-hidden="true">
        <img
            src="../../assets/common/backgrounds/footer-bg.png"
            alt="">
    </div>

    <!-- Center -->
    <div class="footer_content">

        <h2 class="footer_brand">
            Sulwhasoo
        </h2>

        <p class="footer_copy">
            © AMOREPACIFIC CORPORATION. All rights reserved.
        </p>

    </div>

    <!-- Bottom Dock -->
    <div class="footer_bottom">

        <!-- Navigation -->
        <nav
            class="footer_nav"
            aria-label="Footer Navigation">

            <a
                href="#"
                class="footer_pill">
                About us
            </a>

            <a
                href="#"
                class="footer_pill">
                Terms &amp; Conditions
            </a>

            <a
                href="#"
                class="footer_pill">
                Sitemap
            </a>

            <a
                href="#"
                class="footer_pill">
                Cookie Policy
            </a>

        </nav>

        <!-- SNS -->
        <div class="footer_sns">

            <a
                href="#"
                class="footer_sns_btn"
                aria-label="Facebook">

                <img
                    src="../../assets/common/icons/icon-facebook.svg"
                    alt="Facebook">

            </a>

            <a
                href="#"
                class="footer_sns_btn"
                aria-label="Instagram">

                <img
                    src="../../assets/common/icons/icon-instagram.svg"
                    alt="Instagram">

            </a>

            <a
                href="#"
                class="footer_sns_btn"
                aria-label="YouTube">

                <img
                    src="../../assets/common/icons/icon-youtube.svg"
                    alt="YouTube">

            </a>

        </div>

    </div>

</footer>

<script src="footer.js"></script>

</body>
</html>
